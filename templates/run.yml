spec:
  inputs:
    # Remember to update docs/reference/gitlab-ci-component.md
    branch:
      default: main
      description: "This branch is used as the target for releases."

    token:
      description: "GitLab token for creating and updating release MRs."

    extra-files:
      description: 'List of files that are scanned for version references by the generic updater.'
      default: ""

    updaters:
      description: "List of updaters that are run. Default updaters can be removed by specifying them as -name. Multiple updaters should be concatenated with a comma. Default Updaters: changelog,generic (none if prerelease-id is set)"
      default: ""

    prerelease-id:
      description: "Release every version on the branch as a pre-release with this identifier, e.g. staging creates v1.2.0-staging.0. Leave empty for normal releases."
      default: ""

    job-name:
      default: releaser-pleaser
      description: "Name of the created job. Set a different name when you include the component more than once, e.g. for a second branch."

    stage:
      default: build
      description: 'Defines the build stage'

    needs:
      default: [ ]
      type: array
      description: 'Dependencies of the created Job'
    # Remember to update docs/reference/gitlab-ci-component.md
---

$[[ inputs.job-name ]]:
  stage: $[[ inputs.stage ]]
  needs: $[[ inputs.needs ]]

  rules:
    # There is no way to run a pipeline when the MR description is updated :(
    - if: $CI_COMMIT_BRANCH == "$[[ inputs.branch ]]"

  # If a newer releaser-pleaser job runs, this one may be cancelled without problem, releaser-pleaser is idempotent.
  # This only works if the user enables "auto-cancel redundant pipelines", which we do tell them to, because this is
  # intrusive and up to the user.
  interruptible: true

  # No need to have multiple releaser-pleaser jobs running at the same time. They all act on the same global state.
  resource_group: releaser-pleaser

  image:
    name: ghcr.io/apricote/releaser-pleaser:v0.9.0 # x-releaser-pleaser-version
    entrypoint: [ "" ]
  variables:
    GITLAB_TOKEN: $[[ inputs.token ]]
  script:
    - |
      rp run \
        --forge=gitlab \
        --branch=$[[ inputs.branch ]] \
        --extra-files="$[[ inputs.extra-files ]]" \
        --updaters="$[[ inputs.updaters ]]" \
        --prerelease-id="$[[ inputs.prerelease-id ]]"
